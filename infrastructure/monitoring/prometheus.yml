global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: task-api
    metrics_path: /metrics
    # Must match METRICS_TOKEN given to the API (docker-compose passes the same default).
    authorization:
      type: Bearer
      credentials: local-metrics-token-change-me
    static_configs:
      - targets: ['api:4000']
