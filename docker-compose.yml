# Local environment: web (nginx + SPA) -> api -> mongo (single-node replica set) + redis.
#
#   cp .env.example .env            # then set the two secrets
#   docker compose up --build -d
#   docker compose run --rm api node dist/seed.js            # demo data
#   open http://localhost:8080
#
# Optional monitoring stack:  docker compose --profile monitoring up -d
# MongoDB and Redis are published on 127.0.0.1 only (never on public interfaces);
# change MONGO_PORT / REDIS_PORT if those ports are already in use locally.

name: taskmanager

x-api-env: &api-env
  # Development mode: plain-http cookies on localhost and automatic index builds.
  # Production runs NODE_ENV=production behind TLS (see docs/deployment.md).
  NODE_ENV: development
  MONGODB_URI: mongodb://mongo:27017/taskmanager?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  WEB_ORIGIN: http://localhost:8080
  TRUST_PROXY: '1'
  METRICS_TOKEN: ${METRICS_TOKEN:-local-metrics-token-change-me}

services:
  mongo:
    image: mongo:8.0.4
    command: ['--replSet', 'rs0', '--bind_ip_all', '--quiet']
    ports: ['127.0.0.1:${MONGO_PORT:-27017}:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the single-node replica set on first boot, then reports its health.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command:
      ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'volatile-lru']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: *api-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['127.0.0.1:4000:4000']
    stop_grace_period: 25s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on:
      api: { condition: service_healthy }
    ports: ['${WEB_PORT:-8080}:8080']
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-local-metrics-token-change-me}
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']

volumes:
  mongo-data:
  redis-data:
